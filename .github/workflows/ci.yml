name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint (max-warnings=0)
        run: npm run lint

      - name: Typecheck (tsgo)
        run: npm run typecheck

      - name: Unit and integration tests with coverage gates
        run: npm run test:coverage

      - name: Production build (Turbopack)
        run: npm run build

      - name: Dead code (knip)
        run: npm run quality:dead-code

      - name: Circular dependencies (madge)
        run: npm run quality:circular

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
