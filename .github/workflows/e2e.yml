name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (e2e, accessibility, visual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility suites
        run: npx playwright test src/tests/e2e src/tests/accessibility

      # Visual baselines are per-platform; on a fresh runner the missing-baseline
      # policy writes them (testing/visual-testing-standard.md documents the flow).
      - name: Visual suite
        run: npx playwright test src/tests/visual --update-snapshots=missing

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
