name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (e2e, accessibility, visual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: corepack npm ci

      - name: Install Playwright browsers
        run: corepack npm exec -- playwright install --with-deps chromium

      - name: E2E and accessibility suites
        run: corepack npm exec -- playwright test src/tests/e2e src/tests/accessibility

      - name: Visual suite
        run: corepack npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
